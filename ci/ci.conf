#!/usr/bin/env bash

# submodules that PennAiR Software manages and are subject to frequent updates
MANAGED_SUBMODULES=(
    "${PENNAIR_DEPENDENCIES_PATH}"
    "${PENNAIR_PX4_PATH}"
    "${PENNAIR_GZ_MODELS_PATH}"
)

# dict of filenames to external apt sources that need to be added during install
# Ex. espressif.list gets created at /etc/apt/sources.list.d/espressif.list
# ROS apt source not added here because we use a ros-base docker image
declare -A APT_SOURCES=(
    ["espressif.list"]="deb [trusted=yes] https://dl.espressif.com/dl/eim/apt/ stable main"
)

# apt packages that AREN'T already installed via rosdep to avoid conflicts (similar to pyproject.toml dependencies)
APT_PACKAGES=(
    "libgflags-dev"
    "python3-gz-math7" # Gazebo coordinate conversions for sim
    "openjdk-17-jdk" # for assembling microxrceddsgen in Dependencies
    "eim-cli"
    "direnv" # for payload_controller building
)

# npm packages to globally install
GLOBAL_NPM=(
    "xunit-viewer"
)
