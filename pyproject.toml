[project]
name = "monorepo"
version = "0.1.0"
dependencies = [ # these should be packages that AREN'T already installed system wide via apt by rosdep to avoid conflicts
    "pydantic>=2.0,<3",
    "apriltag",
    "junitparser",
]

[dependency-groups]
dev = [
    "ruff==0.16.7",
]

[tool.ruff]
exclude = [
    "controls/sae_2025_ws/src/ros_gz",
    "controls/sae_2025_ws/src/actuator_msgs",
    "controls/sae_2025_ws/src/px4_msgs",
    "PX4-Autopilot",
    "gz-models",
    "Dependencies"
]
line-length=100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
