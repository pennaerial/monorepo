payload:
  controller:
    type: string
    default_value: "GPIOController"
    description: "Controller plugin to instantiate"
    validation:
      one_of<>: [["SimController", "GPIOController"]]

  pins:
    LEFT_PWM:
      type: int
      default_value: 13
      description: "Left motor SN754410 enable/PWM pin"
    LEFT_IN1:
      type: int
      default_value: 20
      description: "Left motor SN754410 IN1 pin"
    LEFT_IN2:
      type: int
      default_value: 16
      description: "Left motor SN754410 IN2 pin"
    RIGHT_PWM:
      type: int
      default_value: 18
      description: "Right motor SN754410 enable/PWM pin"
    RIGHT_IN1:
      type: int
      default_value: 15
      description: "Right motor SN754410 IN1 pin"
    RIGHT_IN2:
      type: int
      default_value: 14
      description: "Right motor SN754410 IN2 pin"
    ENCA_CH1:
      type: int
      default_value: 5
      description: "Encoder A channel 1 GPIO pin"
    ENCA_CH2:
      type: int
      default_value: 6
      description: "Encoder A channel 2 GPIO pin"
    ENCB_CH1:
      type: int
      default_value: 10
      description: "Encoder B channel 1 GPIO pin"
    ENCB_CH2:
      type: int
      default_value: 9
      description: "Encoder B channel 2 GPIO pin"
    SERVO:
      type: int
      default_value: 23
      description: "Hook servo GPIO pin"

  motor:
    pwm_frequency:
      type: double
      default_value: 200.0
      description: "PWM frequency for drive motors"
      validation:
        bounds<>: [1.0, 100000.0]
    max_wheel_rpm:
      type: double
      default_value: 200.0
      description: "Maximum absolute wheel speed setpoint in RPM"
      validation:
        bounds<>: [0.0, 10000.0]
    max_norm_speed:
      type: double
      default_value: 1.0
      description: "Maximum normalized speed command"
      validation:
        bounds<>: [0.0, 1.0]

  encoder:
    output_cpr:
      type: int
      default_value: 617
      description: "Encoder counts-per-revolution at the output shaft"
      validation:
        bounds<>: [1, 1000000]
    left_sign:
      type: int
      default_value: 1
      description: "Left encoder polarity multiplier"
      validation:
        one_of<>: [[-1, 1]]
    right_sign:
      type: int
      default_value: 1
      description: "Right encoder polarity multiplier"
      validation:
        one_of<>: [[-1, 1]]

  kinematics:
    wheel_radius_m:
      type: double
      default_value: 0.01611839
      description: "Wheel radius in meters"
      validation:
        bounds<>: [0.0, 10.0]
    wheel_separation_m:
      type: double
      default_value: 0.12132
      description: "Distance between wheel contact centers in meters"
      validation:
        bounds<>: [0.0, 10.0]

  pid:
    left_kp:
      type: double
      default_value: 0.004
      description: "Left wheel proportional gain"
      validation:
        bounds<>: [0.0, 100000.0]
    left_ki:
      type: double
      default_value: 0.0036
      description: "Left wheel integral gain"
      validation:
        bounds<>: [0.0, 100000.0]
    left_kd:
      type: double
      default_value: 0.0
      description: "Left wheel derivative gain"
      validation:
        bounds<>: [0.0, 100000.0]
    right_kp:
      type: double
      default_value: 0.004
      description: "Right wheel proportional gain"
      validation:
        bounds<>: [0.0, 100000.0]
    right_ki:
      type: double
      default_value: 0.0036
      description: "Right wheel integral gain"
      validation:
        bounds<>: [0.0, 100000.0]
    right_kd:
      type: double
      default_value: 0.0
      description: "Right wheel derivative gain"
      validation:
        bounds<>: [0.0, 100000.0]
    i_clamp:
      type: double
      default_value: 1.0
      description: "Absolute clamp for accumulated integral contribution"
      validation:
        bounds<>: [0.0, 100000.0]
    output_limit_norm:
      type: double
      default_value: 1.0
      description: "Absolute clamp for PID normalized output command"
      validation:
        bounds<>: [0.0, 1.0]
    stop_deadband_rpm:
      type: double
      default_value: 1.0
      description: "Setpoint deadband where output is forced to zero"
      validation:
        bounds<>: [0.0, 100000.0]
    velocity_alpha:
      type: double
      default_value: 1.0
      description: "Low-pass filter alpha for measured velocity [0,1]"
      validation:
        bounds<>: [0.0, 1.0]

  control:
    loop_ms:
      type: int
      default_value: 50
      description: "Control-loop period in milliseconds"
      validation:
        bounds<>: [1, 1000]

  servo:
    pulse_min_us:
      type: double
      default_value: 700.0
      description: "Servo minimum pulse width in microseconds"
      validation:
        bounds<>: [100.0, 5000.0]
    pulse_max_us:
      type: double
      default_value: 2300.0
      description: "Servo maximum pulse width in microseconds"
      validation:
        bounds<>: [100.0, 5000.0]
    frequency:
      type: int
      default_value: 50
      description: "Servo PWM frequency in Hz"
      validation:
        bounds<>: [1, 1000]

  sim:
    world_name:
      type: string
      default_value: "sae"
      description: "Simulation world name"
