modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 3.0
    transitions:
      complete: gentle
      
  gentle:
    mode: iarc_flight.TrackMode
    params:
      trajectory:
        type: min_snap
        time_optimal: true # chooses leg durations to minimize total time within limits
        v_max: # max speed for each leg in given mode
          standard: 3.0
          slow: 0.1
        a_max: # max acceleration
          standard: 0.5
          slow: 0.5
        keyframes: # circle (x-2)^2 + y^2 = 2^2 every 30 deg, starting and ending at the takeoff point (0, 0)
          - {x: 0.0, y: 0.0, z: -5.0, yaw: 0.0, mode: slow}
          - {x: 0.268, y: -1.0, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 1.0, y: -1.732, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 2.0, y: -2.0, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 3.0, y: -1.732, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 3.732, y: -1.0, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 4.0, y: 0.0, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 3.732, y: 1.0, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 3.0, y: 1.732, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 2.0, y: 2.0, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 1.0, y: 1.732, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 0.268, y: 1.0, z: -5.0, yaw: 0.0, mode: standard}
          - {x: 0.0, y: 0.0, z: -5.0, yaw: 0.0, mode: standard}
      controller:
        type: mpc # MPC limits should be set higher than trajectory constraints to avoid saturating the controller
        max_speed: 6.0
        max_vertical_accel: 2.0
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
