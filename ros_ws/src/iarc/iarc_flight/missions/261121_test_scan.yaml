modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 4.572
    transitions:
      complete: scan

  scan:
    mode: iarc_flight.TrackMode
    params:
      trajectory:
        type: min_snap
        time_optimal: true
        v_max:
          scan: 3.35
        a_max:
          scan: 6.0
        keyframes:
          - {x: 20, y: 0, z: -4.572, yaw: 0.0, mode: scan}
          - {x: 0, y: 0, z: -4.572, yaw: 0.0, mode: scan}
      controller:
        type: mpc
        max_speed: 6.0
        max_tilt_deg: 40.0
        max_vertical_accel: 6.0
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
