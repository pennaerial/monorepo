modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 5.0
    transitions:
      complete: gentle
      
  gentle:
    mode: iarc_flight.TrackMode
    params:
      trajectory:
        type: min_snap
        time_optimal: true
        v_max:
          standard: 3.0
        a_max:
          standard: 0.5
        keyframes:
          - {x: 0, y: 0, z: -5, yaw: 0.0, mode: standard}
          - {x: 3, y: 0, z: -5, yaw: 0.0, mode: standard}
          - {x: 0, y: 0, z: -5, yaw: 0.0, mode: standard}
      controller:
        type: mpc
        max_speed: 6.0
        max_vertical_accel: 2.0
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
