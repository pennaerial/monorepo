modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 3.0
    transitions:
      complete: square

  
  square:
    mode: iarc_flight.TrackMode
    params:
      trajectory:
        type: min_snap
        keyframes:
          - {x: 0, y: 0, z: -3, yaw: 0.0, T: 4.0}
          - {x: 5, y: 0, z: -3, yaw: 0.0, T: 4.0}
          - {x: 10, y: 0, z: -3, yaw: 0.0, T: 4.0}
          - {x: 15, y: 0, z: -3, yaw: 1.5708, T: 4.0}
          - {x: 15, y: 5, z: -3, yaw: 3.1416, T: 2.0}
          - {x: 10, y: 5, z: -3, yaw: 3.1416, T: 4.0}
          - {x: 5, y: 5, z: -3, yaw: 3.1416, T: 4.0}
          - {x: 0, y: 5, z: -3, yaw: 1.5708, T: 4.0}
          - {x: 0, y: 10, z: -3, yaw: 0.0, T: 2.0}
          - {x: 5, y: 10, z: -3, yaw: 0.0, T: 4.0}
          - {x: 10, y: 10, z: -3, yaw: 0.0, T: 4.0}
          - {x: 15, y: 10, z: -3, yaw: 1.5708, T: 4.0}
          - {x: 15, y: 15, z: -3, yaw: 3.1416, T: 2.0}
          - {x: 10, y: 15, z: -3, yaw: 3.1416, T: 4.0}
          - {x: 5, y: 15, z: -3, yaw: 3.1416, T: 4.0}
          - {x: 0, y: 15, z: -3, yaw: 3.1416, T: 4.0}
      controller:
        type: mpc
        max_speed: 6.0
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
