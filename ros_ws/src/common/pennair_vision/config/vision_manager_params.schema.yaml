vision_manager:
  camera_topic:
    type: string
    default_value: "/camera/image_raw"
    description: "Image topic used by the vision plugins."

  debug_image_rate:
    type: double
    default_value: 5.0
    read_only: true
    description: "Maximum debug image rate per plugin in Hz; 0 means unlimited."

  plugins:
    type: string_array
    default_value: []
    description: "Vision plugin class names to load at startup."
