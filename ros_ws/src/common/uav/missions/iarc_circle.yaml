modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 3.0
    transitions:
      complete: circle

  circle:
    mode: iarc_flight.TrackMode
    params:
      trajectory:
        type: circle
        radius: 5
        initial_speed: 0
        tangential_accel: 0.2
        max_speed: 4
        altitude: 3
        laps: 2
      controller:
        type: feedforward
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
