modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 6.0
      takeoff_method: OFFBOARD
    transitions:
      complete: triangle

  triangle:
    mode: uav.NavGPSMode
    params:
      max_horizontal_speed: 3.0  # m/s
      max_vertical_speed: 3.0    # m/s
      max_heading_rate: 0.5     # rad/s
      # Right triangle in NED LOCAL frame: +X north, +Y east, -Z up
      # All corners at 10 m altitude (z = -10)
      coordinates:
        - [[10, 0, -6.0], 2, LOCAL]   # corner A — 10 m north
        - [[10, 10, -6.0], 2, LOCAL]  # corner B — 10 m north, 10 m east
        - [[0, 0, -6.0], 2, LOCAL]   # corner C — 10 m east
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
