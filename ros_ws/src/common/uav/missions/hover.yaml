modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 5.0
      takeoff_method: PX4_AUTO
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[0, 0, -3], 5, LOCAL]
        - [[0, 0, -6], 5, LOCAL]
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
