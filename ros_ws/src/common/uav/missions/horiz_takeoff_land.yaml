modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: horizontal
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[100, 100, -15], 2, LOCAL]
      margin: 30
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
