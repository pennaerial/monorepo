modes:
  start:
    mode: uav.VerticalTakeoffMode
    params:
      takeoff_height: 5.0 # meters
      takeoff_method: PX4_AUTO
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[5, 0, -5], 1, LOCAL]
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
