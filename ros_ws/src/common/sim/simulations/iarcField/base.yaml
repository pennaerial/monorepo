world:
  name: iarcField
  node: iarc_field_node

  config:
    # 80 x 300 ft field in 2 ft cells (40 x 150). World origin = centre of the start
    # edge, field runs along +x. At most one PFM-1 per cell.
    random:
      seed: null                   # set an int for a reproducible layout
      count: 300                   # exact number of mines (or use density: 0.05)
      face_down_prob: 0.5
      random_yaw: true
      edge_margin: 0.07            # m from mine centre to cell edge; keeps the mine in its cell
      keep_out: [[0, 0, 1.5]]      # (x, y, radius) m - no mines under the UAV spawn

    style:
      mesh: low                    # low (800 tris) or full (6182 tris)
      cast_shadows: false
      markings:
        border: true
        grid: false                # draw the 2 ft cell lines (the real field has none)

    output_dir: ~/.ros/iarcField   # resolved layout (ground truth) + CSV written each run
