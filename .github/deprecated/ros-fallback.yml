name: ROS Fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ros-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_ros2_workspace:
    name: Validate ROS 2 Workspace (fallback container)
    runs-on: ubuntu-22.04
    container:
      image: ros:jazzy-ros-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable CI dependencies
        run: bash controls/sae_2025_ws/scripts/ci/install_ros_ci_deps.sh

      - name: Build and validate ROS workspace
        env:
          INSTALL_DEPS: "0"
        run: bash controls/sae_2025_ws/scripts/ci/validate_ros_workspace.sh
