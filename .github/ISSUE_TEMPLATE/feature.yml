name: ✨ Feature Request
description: Propose something new that doesn't exist yet
title: "[Feature]: "
labels: ["feature"]
assignees: []
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Minor
        - Medium
        - Major
        - Critical
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary notes
      description: What is it, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: next-steps
    attributes:
      label: Suggested first steps
    validations:
      required: false
