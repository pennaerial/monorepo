name: ROS Sim Validate

on:
  push:
    branches: [main, master, integration]
    paths:
      - ".github/workflows/ros-sim-validate.yml"
      - ".gitmodules"
      - "PX4-Autopilot"
      - "controls/sae_2025_ws/**"
      - "!controls/sae_2025_ws/src/integration/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/ros-sim-validate.yml"
      - ".github/ci/**"
      - ".gitmodules"
      - "PX4-Autopilot"
      - "controls/sae_2025_ws/**"
      - "!controls/sae_2025_ws/src/integration/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ros-sim-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_headless_sim:
    name: Validate Headless Sim
    runs-on: ubuntu-22.04
    container:
      image: ${{ vars.ROS_SIM_CI_IMAGE_AMD64 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Checkout ROS workspace submodules
        run: |
          git submodule sync -- \
            controls/sae_2025_ws/src/px4_msgs
          git submodule update --init --depth=1 -- \
            controls/sae_2025_ws/src/px4_msgs

      - name: Build ROS workspace
        env:
          INSTALL_DEPS: "0"
        run: bash controls/sae_2025_ws/scripts/ci/build_ros_workspace.sh

      - name: Validate headless sim
        run: bash controls/sae_2025_ws/scripts/ci/validate_sim_headless.sh
