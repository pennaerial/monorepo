name: SAE Workspace CI

on:
  push:
    branches: [main, master, integration]
    paths:
      - ".github/workflows/ros2-build.yml"
      - "controls/sae_2025_ws/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/ros2-build.yml"
      - "controls/sae_2025_ws/**"
  workflow_dispatch:

jobs:
  validate_ros2_workspace:
    name: Validate ROS 2 Workspace
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install validation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pip \
            python3-pytest \
            python3-opencv \
            libgflags-dev \
            ros-humble-cv-bridge \
            ros-humble-gps-msgs \
            ros-humble-pluginlib \
            ros-humble-vision-msgs \
            git

          rosdep init 2>/dev/null || true
          rosdep update --rosdistro humble
          python3 -m pip install --no-cache-dir apriltag
          python3 -c "import apriltag; print(apriltag.__file__)"

      - name: Install pigpio from source
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/joan2937/pigpio.git
          cd pigpio
          cmake . -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)
          make install
          ldconfig

      - name: Install hardware package dependencies via rosdep
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          rosdep install -r -i -y --rosdistro humble \
            --from-paths src/uav src/uav_interfaces src/px4_msgs src/actuator_msgs \
              src/payload src/payload_interfaces src/tools

      - name: Build shared hardware dependencies
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          colcon build \
            --packages-select payload_interfaces px4_msgs uav_interfaces actuator_msgs

      - name: Build hardware payload package
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon build \
            --packages-select payload \
            --cmake-args -DBUILD_SIM=OFF

      - name: Build uav package
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon build --packages-select uav

      - name: Build tools package
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon build --packages-select tools

      - name: Build sim package
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --packages-select sim

      - name: Compile Python sources
        working-directory: controls/sae_2025_ws
        run: |
          python3 -m py_compile $(find src/uav src/sim src/tools -name '*.py' | sort)

      - name: Validate mission schema tests
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          PYTHONPATH=$PWD/src/uav:$PYTHONPATH python3 -m pytest src/uav/test/test_mission_spec.py src/uav/test/test_auto_launch.py src/uav/test/test_runtime_behavior.py src/uav/test/test_launch_helpers.py

  validate_integration:
    name: Validate Integration Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: controls/sae_2025_ws/src/integration/frontend/package-lock.json

      - name: Compile integration backend
        working-directory: controls/sae_2025_ws/src/integration
        run: |
          python3 -m py_compile $(find backend -name '*.py' | sort) app.py

      - name: Build integration frontend
        working-directory: controls/sae_2025_ws/src/integration/frontend
        run: |
          npm ci
          npm run build

  build_hardware_artifact:
    name: Build Raspberry Pi Artifact (ARM64)
    runs-on: ubuntu-22.04-arm
    needs:
      - validate_ros2_workspace
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pip \
            python3-opencv \
            libgflags-dev \
            ros-humble-cv-bridge \
            ros-humble-gps-msgs \
            ros-humble-pluginlib \
            ros-humble-vision-msgs \
            git

          rosdep init 2>/dev/null || true
          rosdep update --rosdistro humble
          python3 -m pip install --no-cache-dir apriltag
          python3 -c "import apriltag; print(apriltag.__file__)"

      - name: Install pigpio from source
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/joan2937/pigpio.git
          cd pigpio
          cmake . -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)
          make install
          ldconfig

      - name: Install workspace dependencies via rosdep
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          rosdep install -r -i -y --rosdistro humble \
            --from-paths src/uav src/uav_interfaces src/px4_msgs src/actuator_msgs \
              src/payload src/payload_interfaces src/tools

      - name: Build shared hardware dependencies
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          colcon build \
            --packages-select payload_interfaces px4_msgs uav_interfaces actuator_msgs

      - name: Build hardware payload package
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon build \
            --packages-select payload \
            --cmake-args -DBUILD_SIM=OFF

      - name: Build uav package
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon build --packages-select uav

      - name: Build tools package
        working-directory: controls/sae_2025_ws
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon build --packages-select tools

      - name: Get short SHA
        id: sha
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${GITHUB_SHA:0:7}")
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Extracted SHA: $SHORT_SHA"

      - name: Get build info
        id: info
        run: |
          echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "full_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Create build metadata
        working-directory: controls/sae_2025_ws
        run: |
          cat > install/BUILD_INFO.txt << EOF
          Build Information
          =================
          Commit SHA: ${{ github.sha }}
          Short SHA: ${{ steps.sha.outputs.short_sha }}
          Build Time: ${{ steps.info.outputs.timestamp }}
          Branch: ${{ github.ref_name }}
          ROS Distro: humble
          Target Architecture: arm64 (Raspberry Pi compatible)

          Deployment Instructions:
          1. Extract to your Raspberry Pi
          2. cd to the extracted directory
          3. Install runtime deps:
             sudo apt-get update
             sudo apt-get install -y python3-pip build-essential cmake git
             python3 -m pip install --user apriltag
          4. Install pigpio and start pigpiod:
             cd /tmp
             git clone --depth 1 https://github.com/joan2937/pigpio.git
             cd pigpio
             cmake . -DBUILD_SHARED_LIBS=ON
             make -j\$(nproc)
             sudo make install
             sudo ldconfig
             sudo /usr/local/bin/pigpiod
          5. Source the setup: source install/setup.bash
          6. Run: ros2 launch uav main.launch.py

          Configuration:
          - Integration edits the installed launch params and mission YAMLs under install/uav/share/uav/
          - Launch overrides still use ROS 2 launch arguments such as mission_name:=..., payload_name:=..., and px4_path:=...
          EOF

      - name: Prepare runtime files
        working-directory: controls/sae_2025_ws
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -a install deploy/
          cp src/uav/launch/launch_params_hardware.yaml \
            deploy/install/uav/share/uav/launch/launch_params.yaml
          cp scripts/deploy.sh deploy/ 2>/dev/null || true

      - name: Package build artifacts
        working-directory: controls/sae_2025_ws
        run: |
          cd deploy
          tar -czvf ../ros2-build-${{ steps.sha.outputs.short_sha }}.tar.gz .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ros2-build-${{ steps.sha.outputs.short_sha }}
          path: controls/sae_2025_ws/ros2-build-${{ steps.sha.outputs.short_sha }}.tar.gz
          retention-days: 30

      - name: Create GitHub Release (on main/master push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ steps.sha.outputs.short_sha }}
          name: ROS 2 Build ${{ steps.sha.outputs.short_sha }}
          body: |
            ## ROS 2 Build for Raspberry Pi (ARM64)

            **Commit:** ${{ github.sha }}
            **Built:** ${{ steps.info.outputs.timestamp }}
            **Branch:** ${{ github.ref_name }}

            ### Quick Deploy to Raspberry Pi

            ```bash
            # Download and extract
            mkdir -p ~/uav_ws && cd ~/uav_ws
            wget https://github.com/${{ github.repository }}/releases/download/build-${{ steps.sha.outputs.short_sha }}/ros2-build-${{ steps.sha.outputs.short_sha }}.tar.gz
            tar -xzvf ros2-build-${{ steps.sha.outputs.short_sha }}.tar.gz
            rm ros2-build-${{ steps.sha.outputs.short_sha }}.tar.gz

            # Install runtime deps for payload missions once on the Pi
            sudo apt-get update
            sudo apt-get install -y python3-pip build-essential cmake git
            python3 -m pip install --user apriltag

            # Install pigpio and start pigpiod
            cd /tmp
            git clone --depth 1 https://github.com/joan2937/pigpio.git
            cd pigpio
            cmake . -DBUILD_SHARED_LIBS=ON
            make -j$(nproc)
            sudo make install
            sudo ldconfig
            sudo /usr/local/bin/pigpiod

            # Source ROS 2 and the workspace
            source /opt/ros/humble/setup.bash
            source install/setup.bash

            # Run using the shipped hardware launch params
            ros2 launch uav main.launch.py
            ```

            ### Configuration

            Edit `install/uav/share/uav/launch/launch_params.yaml` or the mission YAMLs in `install/uav/share/uav/missions`.
            Common launch-time overrides use ROS 2 launch args, for example:

            ```bash
            ros2 launch uav main.launch.py mission_name:=basic px4_path:=~/PX4-Autopilot
            ```
          files: controls/sae_2025_ws/ros2-build-${{ steps.sha.outputs.short_sha }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
