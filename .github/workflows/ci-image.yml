name: Publish ROS CI Image

on:
  push:
    branches: [main, master, integration]
    paths:
      - ".github/workflows/ci-image.yml"
      - ".github/ci/**"
      - "controls/sae_2025_ws/scripts/ci/common.sh"
      - "controls/sae_2025_ws/scripts/ci/install_ros_ci_deps.sh"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/ci-image.yml"
      - ".github/ci/**"
      - "controls/sae_2025_ws/scripts/ci/common.sh"
      - "controls/sae_2025_ws/scripts/ci/install_ros_ci_deps.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sae-ros2-ci

jobs:
  build_image:
    name: Build ${{ matrix.arch }} CI image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/ci/ros-humble-ci/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:humble-${{ matrix.arch }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=ci-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.arch }}
