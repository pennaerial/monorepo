name: Workflow Lint

on:
  push:
    branches: [main, master, integration]
    paths:
      - ".github/workflows/**"
      - ".github/ci/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
      - ".github/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.8
