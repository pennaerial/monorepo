name: Issue

on:
  issues:
    types: [opened, edited]

jobs:
  set-issue-field:
    runs-on: ubuntu-latest

    steps:
      - name: Update Issue Priority
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          # Extract priority from the Issue Form.
          PRIORITY=$(printf '%s\n' "$ISSUE_BODY" |
            awk '
              /^### Priority$/ {
                found = 1
                next
              }
              found && NF {
                print
                exit
              }
            ' |
            xargs)

          echo "Priority: $PRIORITY"

          case "$PRIORITY" in
            Low|Medium|High|Urgent)
              ;;
            *)
              echo "Invalid priority: '$PRIORITY'"
              exit 1
              ;;
          esac

          gh api graphql \
            -f query='
              mutation($issueId: ID!, $priority: String!) {
                updateIssueWithFields(input: {
                  issueId: $issueId
                  fields: [
                    {
                      name: "Priority"
                      value: $priority
                    }
                  ]
                }) {
                  issue {
                    id
                  }
                }
              }
            ' \
            -f issueId="$ISSUE_ID" \
            -f priority="$PRIORITY"

          echo "Set issue Priority to '$PRIORITY'."
