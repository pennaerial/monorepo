name: Ruff Checks

on:
  push:
    branches: [main, master, integration]
    paths:
      - ".github/workflows/lint.yml"
      - "controls/sae_2025_ws/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/lint.yml"
      - "controls/sae_2025_ws/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Step 1: Check Formatting
      - name: Check Formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: "--config controls/sae_2025_ws/.ruff.toml format --check --diff controls/sae_2025_ws"

      # Step 2: Check Linting
      - name: Check Linting
        uses: astral-sh/ruff-action@v3
        with:
          args: "--config controls/sae_2025_ws/.ruff.toml check controls/sae_2025_ws"
