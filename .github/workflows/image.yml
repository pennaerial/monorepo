name: Pi image

# Run by hand from the Actions tab. A run on main publishes the image-latest release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_image:
    name: Build Pi image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pennair
        working-directory: rust/cli
        run: cargo build --release --locked

      - name: Build image
        run: |
          sudo apt-get update
          sudo apt-get install -y cloud-guest-utils
          sudo image/build.sh rust/target/release/pennair pennair-pi.img.xz

      # lets a branch's image be downloaded and flashed before it merges
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: pennair-pi-image
          path: pennair-pi.img.xz.*
          compression-level: 0
          retention-days: 7

      - name: Publish releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in "image-${GITHUB_SHA}" image-latest; do
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
                --title "Pi image ($tag)" --notes "Built from ${GITHUB_SHA}."
            gh release upload "$tag" pennair-pi.img.xz.* --clobber
          done
