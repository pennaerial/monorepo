[package]
name = "gcs"
version = "0.1.0"
authors = ["yuzhiliu8 <yuzhiliu8@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ros_interfaces = { workspace = true }
pennair-protocol = { path = "../protocol" }
dioxus = { version = "0.7.1", features = ["router"] }
futures-util = "0.3.34"
bytes = "1.12"
hex = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "macros", "time", "rt"] }
cdr = "0.2.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sha2 = "0.10"
toml = "1.2"

[dev-dependencies]
foxglove = { version = "0.30.3", default-features = false, features = ["websocket"] }
pennair-agent = { path = "../agent" }
# runtime for #[tokio::test]
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net"] }

[features]
default = ["desktop"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["net"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
] }
