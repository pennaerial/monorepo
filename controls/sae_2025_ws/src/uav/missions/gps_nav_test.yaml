modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[47.396329, 8.549723, 10], 2, GPS]
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
