modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: patchsearch

  patchsearch:
    mode: uav.FlyToPatch
    params:
      altitude: 7.0 # alt to view patch
      low_altitude: 0.3 # alt to view apriltag
      hover_seconds: 3.0 # time to wait for camera settle
      descent_rate: 1.0 # speed of descent
      margin: 1.0
      hold: false
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
