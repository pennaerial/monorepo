modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: gps

  gps:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[0, 0, -20], 1, LOCAL]
    transitions:
      complete: transition_to_fw

  transition_to_fw:
    mode: uav.vtol.TransitionMode
    params:
      to_mode: FW
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
