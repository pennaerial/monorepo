modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[5, 10, -10], 1, LOCAL]
    transitions:
      complete: dropoff

  dropoff:
    mode: uav.PayloadDropoffMode
    params:
      offsets: [0.0, 0.0, 0.0]
    transitions:
      complete: pickup

  pickup:
    mode: uav.PayloadPickupMode
    params:
      color: blue
    transitions:
      complete: return

  return:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[0, 0, -5], 1, LOCAL]
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
