modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[5, 0, -10], 5, LOCAL]
        - [[0, 0, -10], 30, LOCAL]
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
