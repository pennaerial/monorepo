# Example fleet spec for `ros2 launch uav fleet.launch.py fleet_file:=...`
#
# Fleet specs attach mission/runtime stacks to controllables that already exist in
# the selected backend stage. They do not define vehicle hardware, PX4 airframes,
# PX4 namespaces, PX4 instance indices, or payload controller plugins.

backend:
  # Backend kind. Use `sim` for simulation; `hardware` or `real` for hardware runtime.
  kind: sim

  # PX4 checkout used for any managed UAVs in this fleet.
  px4_path: ~/PX4-Autopilot

  # Canonical world family under `src/sim/sim/simulations/`.
  world_name: sae

  # Stage file inside that world family. If omitted, fleet launch uses `base`.
  mission_stage: payload_retreat

  # Shared MicroXRCEAgent UDP port for all managed UAVs in this fleet.
  middleware_port: 8888

  # Optional deep-merge overrides applied on top of the canonical stage world.
  # Use this to tweak spawn poses or add/adjust `entities` and `controllables`
  # without copying the entire stage YAML into the fleet file.
  #
  # world_overrides:
  #   params:
  #     entities:
  #       dlz:
  #         position: [0.0, 0.0, 0.0]
  #         rpy: [0.0, 0.0, 0.0]
  #     controllables:
  #       uav_0:
  #         position: [5.0, 0.0, 0.1]
  #         rpy: [0.0, 0.0, 0.0]

# Shared runtime and camera knobs merged into every vehicle entry below.
defaults:
  # If true, the mission manager starts itself once ready.
  # If false, call `/<vehicle>/mode_manager/start_mission` manually.
  auto_launch: true

  # Extra runtime logging from the mission manager and active modes.
  debug: false

  # Extra logging/visualization from the vision stack.
  vision_debug: false

  # Force the camera stack on even when the mission does not declare it.
  force_camera: false

  # Persist vision frames for this many milliseconds. `0` disables capture.
  save_vision_milliseconds: 0

  # Restrict payload-side actuation to the servo path only.
  servo_only: false

  # Camera mount x/y/z offsets in the vehicle frame.
  camera_mount_offsets: [0.0, 0.0, 0.0]

  # Camera transport for image subscriptions. Common values: `raw`, `compressed`.
  camera_input_transport: raw

  # Rotate incoming camera images clockwise by this many degrees before vision.
  camera_rotate_degrees: 0.0

  # Packaged payload camera calibration filename from uav/config/camera_calibrations.
  camera_calibration_file: payload_0_camera_info.yaml

  # Optional Python hook to preprocess images before they reach vision nodes.
  # Leave blank to disable. This must resolve inside the runtime environment.
  camera_preprocess_hook: ""

  # Optional hardware fallback Wi-Fi role. Use `default` to defer to the Pi's
  # bootstrap policy, `ap` to host a fallback AP, or `client` to join one.
  network_role: default

  # For client-role hardware vehicles, choose a preferred AP selection strategy.
  ap_selection: ordered_then_strongest

vehicles:
  # Fleet vehicle entries bind one managed stack to one backend controllable.
  - name: uav_0

    # Must match a controllable defined by the resolved backend stage/world.
    controllable: uav_0

    # Use `mission:` for bundled package missions...
    mission: hover
    # ...or `mission_path:` for an arbitrary mission YAML on disk.
    # mission_path: /absolute/path/to/custom_uav_mission.yaml

    # Any shared knob from `defaults` can be overridden per vehicle.
    debug: true
    camera_mount_offsets: [0.2, 0.0, 0.0]
    network_role: client
    allowed_ap_vehicles: [payload_0]

  - name: payload_0
    controllable: payload_0
    mission: payload_retreat

    # Per-vehicle camera/runtime overrides are often most useful on payloads.
    vision_debug: true
    camera_input_transport: compressed
    camera_rotate_degrees: 180.0
    # camera_calibration_file: payload_front_camera_info.yaml
    # camera_preprocess_hook: my_package.my_module:preprocess
    network_role: ap

    # UDP bridge (payload hardware only). All params are optional.
    #
    # udp_port: omit to auto-assign from vehicle name (payload_N → 5000+N).
    #   Set to 0 to disable the UDP bridge for this vehicle.
    # udp_port: 5000
    #
    # udp_all_ports: all peer ports in the fleet (including this vehicle's port).
    #   Default: [5000, 5001, 5002, 5003]
    # udp_all_ports: [5000, 5001, 5002, 5003]
    #
    # udp_topics: topics to bridge as "topic_name:pkg/msg/MsgType" pairs.
    #   Default: PayloadHeartbeat on topic "heartbeat"
    # udp_topics:
    #   - "heartbeat:payload_interfaces/msg/PayloadHeartbeat"
    #
    # udp_broadcast_ip: subnet broadcast address. Default: 10.42.0.255
    # udp_broadcast_ip: "10.42.0.255"
