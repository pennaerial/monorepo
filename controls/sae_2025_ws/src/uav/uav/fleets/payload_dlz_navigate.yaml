backend:
  kind: sim
  px4_path: ~/PX4-Autopilot
  world_name: sae
  mission_stage: line_following

defaults:
  auto_launch: true
  debug: false
  vision_debug: true
  save_vision_milliseconds: 0
  servo_only: false
  camera_mount_offsets: [0.0, 0.0, 0.0]
  # auto computed based on sim vs real:
  # camera_input_transport: raw
  # camera_rotate_degrees: 0.0
  camera_preprocess_hook: ""

vehicles:
  - name: payload_0
    controllable: payload_0
    mission: payload_dlz_navigate
    # camera_mount_offsets: [0.2, 0.0, 0.0]