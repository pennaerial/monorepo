modes:
  start:
    class: uav.modes.uav.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: GPS

  GPS:
    class: uav.modes.uav.NavGPSMode
    params:
      coordinates:
        - [[47.396329, 8.549723, 10], 2, GPS]
    transitions:
      complete: land

  land:
    class: uav.modes.uav.LandingMode
