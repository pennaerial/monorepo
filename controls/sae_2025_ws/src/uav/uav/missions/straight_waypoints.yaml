modes:
  start:
    class: uav.modes.uav.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: GPS

  GPS:
    class: uav.modes.uav.NavGPSMode
    params:
      coordinates:
        - [[0, 3, -5], 2, LOCAL]
        - [[0, 6, -5], 2, LOCAL]
        - [[0, 0, -5], 3, LOCAL]
    transitions:
      complete: land

  land:
    class: uav.modes.uav.LandingMode
