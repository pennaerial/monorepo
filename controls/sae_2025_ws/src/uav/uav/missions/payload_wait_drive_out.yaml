modes:
  start:
    class: uav.modes.payload.PayloadWaitForDriveOutMode.PayloadWaitForDriveOutMode
    params:
      confirm_frames: 5
      lower_hsv: [0, 0, 180]
      upper_hsv: [180, 46, 255]

    transitions:
      complete: retreat

  retreat:
    class: uav.modes.payload.PayloadRetreatMode
    params:
      payload_name: payload_0
      forward_speed_mps: 0.12
      edge_threshold: 0.30
      edge_stable_frames: 5
      edge_min_pixels: 500
      edge_invalid_max_frames: 30
      turn_direction: 1
      camera_debug: false
      compressed_image: false


