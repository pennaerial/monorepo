# VTOL stationary; payload finds the front AprilTag, drives to it, and terminates.
# Keeps this branch's closer tag size / distance tuning on the current payload mission runtime.
modes:
  start:
    class: uav.modes.payload.PayloadDriveToAprilTagMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      stop_distance_m: 0.07
      linear_gain: 0.5
      angular_gain: 0.003
