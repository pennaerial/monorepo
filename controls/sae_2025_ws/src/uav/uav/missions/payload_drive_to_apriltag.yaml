# VTOL stationary; payload finds any AprilTag, drives to it, stops 1 cm in front.
# AprilTag size: 100 mm x 100 mm. Mode returns "terminate" when done.
start:
  class: uav.autonomous_modes.AprilTagApproachMode
  params:
    payload_name: 'payload_0'
    tag_id: '0' 
    tag_size_m: '0.0508'   # 100 mm x 100 mm (string so ModeManager literal_eval works)
    forward_speed: '0.2'   # m/s
    angular_gain: '0.003'  # rad/s of yaw rate per pixel of lateral error
    yaw_gain: '1'        # rad/s per radian of yaw mis
    stop_distance_m: '0.1' # m
    camera_debug: 'True'
    compressed_image: 'False' 
  transitions:
    complete: land

land:
  class: uav.autonomous_modes.LandingMode
