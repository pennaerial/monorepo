modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: transition_to_fw

  transition_to_fw:
    mode: uav.vtol.TransitionMode
    params:
      to_mode: FW
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[30, 30, -10], 2, LOCAL]
      margin: 30
    transitions:
      complete: transition_to_mc

  transition_to_mc:
    mode: uav.vtol.TransitionMode
    params:
      to_mode: MC
    transitions:
      complete: GPS2

  GPS2:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[0, 0, -10], 2, LOCAL]
      margin: 2
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
