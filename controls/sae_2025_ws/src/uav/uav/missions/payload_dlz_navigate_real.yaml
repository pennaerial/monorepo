# Payload DLZ navigation: wait for plane → scan tags → line-follow to dock side → approach.
#
# tag_transition_table key format:
#   comma-separated AND-groups, pipe-separated OR within a group.
#   "0|4|5,2" = (tag 0 OR 4 OR 5 visible) AND (tag 2 visible)
#   More-specific keys should come first (tested in order).
#
# Flow:
#   start ──done──► scan ──found──► apriltag_approach
#                    │
#                 not_found
#                    │
#                  retry (start_phase=scan_tags; re-scans, advances more transitions)
#                    │
#                  done──► scan  (loops)
modes:
  start:
    mode: payload.PayloadDLZNavigateMode
    params:
      start_phase: "wait_for_plane"
      detect_frames: 5
      scan_duration_s: 2.0
      tag_transition_table:
        # Fill in with your actual mappings.
        # Key: visible tag combo (OR groups with |, AND groups with ,)
        # Value: transitions to travel and direction to travel
        "0|4|5,2": {transitions: 1, direction: ccw}  # front + left
        "0|4|5,3": {transitions: 1, direction: cw}   # front + right
        "0|4|5":   {transitions: 0, direction: ccw}  # front only (already at dock)
        "1|6|7,2": {transitions: 3, direction: ccw}  # back + left
        "1|6|7,3": {transitions: 3, direction: cw}   # back + right
        "1|6|7":   {transitions: 4, direction: cw}  # back only
        "2":       {transitions: 2, direction: ccw}  # left only
        "3":       {transitions: 2, direction: cw}   # right only
      tag_size_m: 0.0508
      turn_angular_speed: 0.5
      line_follow_speed_mps: 0.1
      k_lat: 0.01
      k_ang: 0.4
      max_angular: 0.5
      corner_angular_speed: 0.5
      # HSV bounds — copy of payload_corner_navigate_real.yaml so the same
      # tape calibration is used. ccw_hsv = colour at the start of a CCW-
      # travel side (blue). cw_hsv = colour at the start of a CW-travel
      # side (pink in the real arena).
      ccw_lower_hsv: [100, 100, 100] # blue
      ccw_upper_hsv: [130, 255, 255]
      cw_lower_hsv: [160, 102, 216]  # pink
      cw_upper_hsv: [170, 153, 255]
