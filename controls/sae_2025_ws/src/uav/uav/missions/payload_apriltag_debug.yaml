# Idle mission that spins up the AprilTag vision node for debug viewing.
# The PayloadScanForTagMode with zero spin speed keeps the node alive
# indefinitely without moving the vehicle.
modes:
  start:
    mode: payload.PayloadScanForTagMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      tag_family: tag36h11
      spin_angular_speed: 0.0
      loop: true
