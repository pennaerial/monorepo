# Full payload run: wait for drive-out → corner navigate → AprilTag approach.
# PayloadWaitForDriveOutMode returns "complete" → corner_nav
# PayloadCornerNavigateMode returns "complete" → approach
# PayloadAprilTagApproachMode returns "done" → mission ends
modes:
  start:
    # mode: payload.PayloadWaitForDriveOutMode
    # params:
    #   turn_angular: 3.14
    #   turn_speed: 1.5
    # transitions:
    #   complete: corner_nav

    mode: payload.PayloadCornerNavigateMode
    params:
      direction: ccw
      # Side colours and guide detection now come from the shared
      # orange-relative DLZ heuristic:
      #   blue = ccw side
      #   purple = cw side
      #   green = corner-align guide
      dlz_mask_enabled: true
      dlz_mask_lower_hsv: [5, 78, 158]
      dlz_mask_upper_hsv: [25, 189, 255]
      dlz_mask_min_area_frac: 0.03
      dlz_mask_min_component_pixels: 200
      dlz_mask_kernel_size: 5
      dlz_mask_dilate_iterations: 1
      dlz_mask_seed_reject_hsv_ranges:
        - {lower: [100, 100, 100], upper: [130, 255, 255]} # blue
        - {lower: [140, 0, 85], upper: [170, 255, 255]} # purple
        - {lower: [141, 18, 122], upper: [180, 255, 255]} # pink/red
        - {lower: [30, 110, 20], upper: [40, 255, 255]} # green guide

      drive_out_speed_mps: 0.1
      detect_frames: 2
      max_drive_out_s: 30.0
      drive_out_strip_frac: 0.30   # only the bottom 30% of the camera frame
      drive_out_min_pixels: 150
      compressed_image: true
      align_angular_speed: 0.5
      center_tol_px: 30.0
      center_min_pixels: 150
      center_stable_frames: 1
      line_follow_speed_mps: 0.10
      line_follow_strip_frac: 0.40
      line_follow_min_pixels: 50
      k_lat: 0.0025
      k_d: 0.0003
      max_angular: 1.3
      # TAPE_ALIGN now uses the green guide mask from the shared DLZ helper.
      tape_align_angular_speed: 0.6
      tape_align_center_tol_px: 20.0
      tape_align_min_pixels: 100
      tape_align_stable_frames: 3
    transitions:
      complete: dlz_navigate

  dlz_navigate:
    mode: payload.PayloadDLZNavigateMode
    params:
      start_phase: "wait_for_plane"
      detect_frames: 5
      scan_duration_s: 2.0
      tag_transition_table:
        # Fill in with your actual mappings.
        # Key: visible tag combo (OR groups with |, AND groups with ,)
        # Value: transitions to travel and direction to travel
        # "0|4|5,2": {transitions: 1, direction: ccw}  # front + left
        # "0|4|5,3": {transitions: 1, direction: cw}   # front + right
        # "0|4|5":   {transitions: 0, direction: ccw}  # front only (already at dock)
        # "1|6|7,2": {transitions: 3, direction: ccw}  # back + left
        # "1|6|7,3": {transitions: 3, direction: cw}   # back + right
        # "1|6|7":   {transitions: 4, direction: cw}  # back only
        # "2":       {transitions: 2, direction: ccw}  # left only
        # "3":       {transitions: 2, direction: cw}   # right only

        "0|4|5,2": {transitions: 1, direction: ccw}  # front + left
        "0|4|5,3": {transitions: 1, direction: cw}   # front + right
        "0|4|5":   {transitions: 0, direction: cw}  # front only (already at dock)
        "1|6|7,2": {transitions: 3, direction: ccw}  # back + left
        "1|6|7,3": {transitions: 3, direction: cw}   # back + right
        "1|6|7":   {transitions: 4, direction: cw}  # back only
        "2":       {transitions: 2, direction: ccw}  # left only
        "3":       {transitions: 2, direction: cw}   # right only
      tag_size_m: 0.0508
      turn_angular_speed: 0.5
      line_follow_speed_mps: 0.1
      k_lat: 0.01
      k_ang: 0.4
      k_d_lat: 0.002
      max_angular: 0.5
      corner_angular_speed: 0.5
      # Side colours now come from the shared orange-relative DLZ heuristic:
      #   A = purple / cw side
      #   B = blue / ccw side
      dlz_mask_enabled: true
      dlz_mask_lower_hsv: [5, 78, 158]
      dlz_mask_upper_hsv: [25, 189, 255]
      dlz_mask_min_area_frac: 0.03
      dlz_mask_min_component_pixels: 200
      dlz_mask_kernel_size: 5
      dlz_mask_dilate_iterations: 1
      dlz_mask_seed_reject_hsv_ranges:
        - {lower: [100, 100, 100], upper: [130, 255, 255]} # blue
        - {lower: [140, 0, 85], upper: [170, 255, 255]} # purple
        - {lower: [141, 18, 122], upper: [180, 255, 255]} # pink/red
        - {lower: [30, 110, 20], upper: [40, 255, 255]} # green guide
    transitions:
      done: scan

  scan:
    mode: payload.PayloadScanForTagMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      spin_angular_speed: 0.4
      compressed_image: true
    transitions:
      found: dual_approach
      not_found: retry

  retry:
    mode: payload.PayloadDLZNavigateMode
    params:
      start_phase: "scan_tags"   # already on tape; re-scan then line-follow more transitions
      scan_duration_s: 1.0
      tag_transition_table:
        "0|4|5,2": {transitions: 1, direction: ccw}  # front + left
        "0|4|5,3": {transitions: 1, direction: cw}   # front + right
        "0|4|5":   {transitions: 0, direction: cw}  # front only (already at dock)
        "1|6|7,2": {transitions: 3, direction: ccw}  # back + left
        "1|6|7,3": {transitions: 3, direction: cw}   # back + right
        "1|6|7":   {transitions: 4, direction: cw}  # back only
        "2":       {transitions: 2, direction: ccw}  # left only
        "3":       {transitions: 2, direction: cw}   # right only
      tag_size_m: 0.0508
      turn_angular_speed: 0.5
      line_follow_speed_mps: 0.1
      k_lat: 0.01
      k_ang: 0.4
      k_d_lat: 0.002
      max_angular: 0.5
      corner_angular_speed: 0.5
      # Side colours now come from the shared orange-relative DLZ heuristic:
      #   A = purple / cw side
      #   B = blue / ccw side
      dlz_mask_enabled: true
      dlz_mask_lower_hsv: [5, 78, 158]
      dlz_mask_upper_hsv: [25, 189, 255]
      dlz_mask_min_area_frac: 0.03
      dlz_mask_min_component_pixels: 200
      dlz_mask_kernel_size: 5
      dlz_mask_dilate_iterations: 1
      dlz_mask_seed_reject_hsv_ranges:
        - {lower: [100, 100, 100], upper: [130, 255, 255]} # blue
        - {lower: [140, 0, 85], upper: [170, 255, 255]} # purple
        - {lower: [141, 18, 122], upper: [180, 255, 255]} # pink/red
        - {lower: [30, 110, 20], upper: [40, 255, 255]} # green guide
    transitions:
      done: scan

  dual_approach:
    mode: payload.PayloadDualApproachMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      tag_forward_gain: 0.5
      tag_max_forward_speed: 0.2
      tag_angular_gain: 0.003
      tag_yaw_gain: 0.6
      # lower_hsv: [10, 80, 120] # yellow
      # upper_hsv: [25, 255, 255]
      lower_hsv: [100, 100, 100]
      upper_hsv: [130, 255, 255]
      color_forward_speed: 0.2
      color_angular_gain: 0.0045
      color_centering_threshold_px: 15
      color_drive_angular_scale: 0.1
      color_min_detect_pixels: 50
      stop_height_px: 360
      lost_timeout_s: 0.0
      compressed_image: true
