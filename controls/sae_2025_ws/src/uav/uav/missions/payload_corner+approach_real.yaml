# Payload starts inside the alternating-border DLZ at any orientation, drives
# outward until it sees the red/blue tape, aligns with it, and follows the
# border in the configured direction until reaching the first corner.
# PayloadCornerNavigateMode signals "done" when the corner is reached, or
# "terminate" if the drive-out times out without finding the tape.
modes:
  start:
    mode: payload.PayloadCornerNavigateMode
    params:
      direction: ccw
      # Target colours in standard HSV: blue=(240°,100%,100%), red=(0°,100%,100%).
      # OpenCV hue is 0-179 (half of standard), so 240°→120 and 0°→0. Tight
      # hue bands around each target, S/V ≥100 to tolerate real lighting.
      ccw_lower_hsv: [100, 100, 100] # blue  (was [100, 100, 100])
      ccw_upper_hsv: [130, 255, 255] #        (was [140, 255, 255])
      cw_lower_hsv: [170, 140, 120]   # red   (was [0, 100, 100])
      cw_upper_hsv: [180, 255, 255]  #        (was [10, 255, 255])
      drive_out_speed_mps: 0.15
      detect_frames: 3
      max_drive_out_s: 30.0
      drive_out_strip_frac: 0.30   # only the bottom 20% of the camera frame
      drive_out_min_pixels: 150
      compressed_image: false
      align_angular_speed: 0.7
      center_tol_px: 30.0
      center_min_pixels: 150
      center_stable_frames: 1
      line_follow_speed_mps: 0.10
      line_follow_strip_frac: 0.40
      line_follow_min_pixels: 50
      k_lat: 0.003
      max_angular: 1.3
      # TAPE_ALIGN — rotate until diagonal black-tape centroid is centered
      tape_align_lower_hsv: [0, 0, 0]
      tape_align_upper_hsv: [180, 255, 60]
      tape_align_angular_speed: 0.6
      tape_align_center_tol_px: 20.0
      tape_align_min_pixels: 100
      tape_align_stable_frames: 3

    transitions:
      complete: dlz_navigate

  dlz_navigate:
    mode: payload.PayloadDLZNavigateMode
    params:
      start_phase: "wait_for_plane"
      detect_frames: 5
      scan_duration_s: 2.0
      tag_transition_table:
        # Fill in with your actual mappings.
        # Key: visible tag combo (OR groups with |, AND groups with ,)
        # Value: transitions to travel and direction to travel
        "0|4|5,2": {transitions: 1, direction: ccw}  # front + left
        "0|4|5,3": {transitions: 1, direction: cw}   # front + right
        "0|4|5":   {transitions: 0, direction: ccw}  # front only (already at dock)
        "1|6|7,2": {transitions: 3, direction: ccw}  # back + left
        "1|6|7,3": {transitions: 3, direction: cw}   # back + right
        "1|6|7":   {transitions: 4, direction: ccw}  # back only
        "2":       {transitions: 2, direction: ccw}  # left only
        "3":       {transitions: 2, direction: cw}   # right only
      tag_size_m: 0.0508
      turn_angular_speed: 0.5
      line_follow_speed_mps: 0.3
      k_lat: 0.01
      k_ang: 0.4
      max_angular: 0.5
    transitions:
      done: scan

  scan:
    mode: payload.PayloadScanForTagMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      spin_angular_speed: 0.4
    transitions:
      found: apriltag_approach
      not_found: retry

  retry:
    mode: payload.PayloadDLZNavigateMode
    params:
      start_phase: "scan_tags"   # already on tape; re-scan then line-follow more transitions
      scan_duration_s: 1.0
      tag_transition_table:
        "0|4|5,2": {transitions: 2, direction: ccw}
        "0|4|5,3": {transitions: 6, direction: cw}
        "0|4|5":   {transitions: 0, direction: ccw}
        "1|6|7,2": {transitions: 4, direction: ccw}
        "1|6|7,3": {transitions: 4, direction: cw}
        "1|6|7":   {transitions: 4, direction: ccw}
      tag_size_m: 0.0508
      turn_angular_speed: 0.5
      line_follow_speed_mps: 0.3
      k_lat: 0.01
      k_ang: 0.4
      max_angular: 0.5
    transitions:
      done: scan

  apriltag_approach:
    mode: payload.PayloadAprilTagApproachMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      max_forward_speed: 0.2
      forward_gain: 0.5
      angular_gain: 0.003
      yaw_gain: 0.65
      stop_distance_m: 0.08
