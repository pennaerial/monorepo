modes:
  start:
    class: uav.modes.uav.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: gps

  gps:
    class: uav.modes.uav.NavGPSMode
    params:
      coordinates:
        - [[0, 0, -20], 1, LOCAL]
    transitions:
      complete: transition_to_fw

  transition_to_fw:
    class: uav.modes.uav.TransitionMode
    params:
      to_mode: FW
    transitions:
      complete: land

  land:
    class: uav.modes.uav.LandingMode
