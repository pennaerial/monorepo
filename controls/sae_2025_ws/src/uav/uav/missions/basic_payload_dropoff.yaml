modes:
  start:
    class: uav.modes.uav.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: GPS

  GPS:
    class: uav.modes.uav.NavGPSMode
    params:
      coordinates:
        - [[5, 10, -10], 1, LOCAL]
    transitions:
      complete: payload

  payload:
    class: uav.modes.uav.PayloadDropoffMode
    params:
      offsets: [0.0, 0.0, 0.0]
    transitions:
      complete: land

  land:
    class: uav.modes.uav.LandingMode
