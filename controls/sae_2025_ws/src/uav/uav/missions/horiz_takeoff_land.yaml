modes:
  start:
    class: uav.modes.uav.TakeoffMode
    params:
      takeoff_type: horizontal
    transitions:
      complete: GPS

  GPS:
    class: uav.modes.uav.NavGPSMode
    params:
      coordinates:
        - [[100, 100, -15], 2, LOCAL]
      margin: 30
    transitions:
      complete: land

  land:
    class: uav.modes.uav.LandingMode
