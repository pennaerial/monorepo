modes:
  start:
    class: uav.modes.uav.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: transition_to_fw

  transition_to_fw:
    class: uav.modes.uav.TransitionMode
    params:
      to_mode: FW
    transitions:
      complete: gps

  gps:
    class: uav.modes.uav.NavGPSMode
    params:
      coordinates:
        - [[5, 10, -10], 1, LOCAL]
        - [[10, 20, -10], 1, LOCAL]
        - [[-5, 0, -10], 1, LOCAL]
    transitions:
      complete: transition_to_mc

  transition_to_mc:
    class: uav.modes.uav.TransitionMode
    params:
      to_mode: MC
    transitions:
      complete: land

  land:
    class: uav.modes.uav.LandingMode
