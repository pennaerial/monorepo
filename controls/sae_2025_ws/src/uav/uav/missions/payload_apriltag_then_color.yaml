# Approach an AprilTag, then continue toward a dark gray colour target.
# PayloadAprilTagApproachMode returns "done" or "tag_lost" → transitions to color_approach
# PayloadColorStringApproachMode returns "terminate" → mission ends
modes:
  start:
    mode: payload.PayloadAprilTagApproachMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      max_forward_speed: 0.2
      forward_gain: 0.5
      angular_gain: 0.006
      yaw_gain: 0.6
      stop_distance_m: 0.2
      compressed: false
    transitions:
      done: color_approach
      tag_lost: color_approach

  color_approach:
    mode: payload.PayloadColorStringApproachMode
    params:
      lower_hsv: [20, 100, 100]
      upper_hsv: [35, 255, 255]
      forward_speed: 0.015
      angular_gain: 0.003
      centering_threshold_px: 15
      drive_angular_scale: 0.3
      min_detect_pixels: 50
      stop_area: 17000
      lost_timeout_s: 3.0
      compressed: false
