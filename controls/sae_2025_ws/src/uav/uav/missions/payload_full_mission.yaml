modes:
  start:
    class: uav.modes.payload.PayloadWaitForDriveOutMode.PayloadWaitForDriveOutMode
    params:
      dark_threshold: 100
      clear_ratio: 0.3
      wait_seconds: 5.0
      turn_angular: -3.14
      turn_speed: 1.3
      compressed_image: false
      debug: true
    transitions:
      complete: corner

  corner:
    class: uav.modes.payload.PayloadCornerNavigateMode
    params:
      direction: ccw
      # Target colours in standard HSV: blue=(240°,100%,100%), red=(0°,100%,100%).
      # OpenCV hue is 0-179 (half of standard), so 240°→120 and 0°→0. Tight
      # hue bands around each target, S/V ≥100 to tolerate real lighting.
      ccw_lower_hsv: [100, 100, 100] # blue  (was [100, 100, 100])
      ccw_upper_hsv: [130, 255, 255] #        (was [140, 255, 255])
      cw_lower_hsv: [170, 140, 120]  # red   (was [0, 100, 100])
      cw_upper_hsv: [180, 255, 255]  #        (was [10, 255, 255])
      drive_out_speed_mps: 0.23
      detect_frames: 3
      max_drive_out_s: 30.0
      drive_out_strip_frac: 0.40   # only the bottom 30% of the camera frame
      drive_out_min_pixels: 150
      compressed_image: false
      align_angular_speed: 0.9
      center_tol_px: 30.0
      center_min_pixels: 150
      center_stable_frames: 1
      line_follow_speed_mps: 0.10
      line_follow_strip_frac: 0.40
      line_follow_min_pixels: 50
      k_lat: 0.004
