modes:
  start:
    mode: uav.vtol.TakeoffMode
    params:
      takeoff_type: vertical
    transitions:
      complete: GPS

  GPS:
    mode: uav.NavGPSMode
    params:
      coordinates:
        - [[-5, -10, -10], 1, LOCAL]
    transitions:
      complete: payload

  payload:
    mode: uav.PayloadPickupMode
    params:
      color: yellow
    transitions:
      complete: land

  land:
    mode: uav.LandingMode
