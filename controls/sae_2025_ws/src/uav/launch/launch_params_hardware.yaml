# launch_params_hardware.yaml
# Configuration for running on real hardware.

mission_name: basic
# Vehicle namespace for mission-facing topics/services.
# Leave blank to use the mission-target default (`uav` for UAV missions, `payload_0` for payload missions).
vehicle_name: ""
debug: false
vision_debug: false
# Automatically start the mission manager once its runtime is ready.
# Set false to leave the mission idle until /<vehicle>/mode_manager/start_mission is called.
auto_launch: true

# PX4 / airframe settings for UAV missions.
airframe: standard_vtol
custom_airframe_model: ""
# Optional explicit PX4 instance index. Multi-vehicle simulation assigns this automatically.
px4_instance: 0

# Force the camera stack (v4l2 + camera node) to launch even when the selected
# mission metadata does not require it.
force_camera: false

# Vehicle camera settings. Applied whenever the camera pipeline launches.
save_vision_milliseconds: 0
camera_mount_offsets: [0.0, 0.0, 0.0]
camera_input_transport: compressed
camera_rotate_degrees: 180.0
camera_calibration_file: payload_0_camera_info.yaml
camera_preprocess_hook: ""

# Mission runtime knobs.
servo_only: false
payload_controller: GPIOController

# UDP bridge settings for inter-Pi communication (payload hardware missions only).
# All four params are optional — sane defaults are applied automatically.
#
# udp_port: omit (or comment out) to auto-assign from the vehicle name:
#   payload_0 → 5000, payload_1 → 5001, payload_2 → 5002, etc.
#   Set to 0 to disable the UDP bridge entirely.
# udp_port: 5000
#
# udp_all_ports: all peer ports in the fleet (including this node's own port).
#   Peers are derived by excluding udp_port from this list.
#   Default: [5000, 5001, 5002, 5003]
# udp_all_ports: [5000, 5001, 5002, 5003]
#
# udp_topics: topics to bridge, as "topic_name:pkg/msg/MsgType" pairs.
#   Default: PayloadHeartbeat on topic "heartbeat"
# udp_topics:
#   - "heartbeat:payload_interfaces/msg/PayloadHeartbeat"
#
# udp_broadcast_ip: subnet broadcast address for the AP hotspot network.
#   Default: 10.42.0.255 (NetworkManager hotspot default)
# udp_broadcast_ip: "10.42.0.255"

sim: false
