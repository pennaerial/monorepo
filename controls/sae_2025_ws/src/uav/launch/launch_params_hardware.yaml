# launch_params_hardware.yaml
# Configuration for running on real hardware.

mission_name: basic
uav_debug: false
vision_debug: false
# Automatically start the mission manager once its runtime is ready.
# Set false to leave the mission idle until /mode_manager/start_mission is called.
auto_launch: true

# PX4 / airframe settings for UAV missions.
airframe: standard_vtol
custom_airframe_model: ""

# Vehicle camera pipeline settings. Only used when the mission modes require vision nodes.
enable_vehicle_camera_pipeline: true
save_vision_milliseconds: 0
uav_camera_offsets: [0.0, 0.0, 0.0]
payload_camera_input_transport: compressed
payload_camera_rotate_degrees: 180.0
payload_camera_preprocess_hook: ""

# Mission runtime knobs.
servo_only: false
payload_name: payload_0
payload_controller: GPIOController

sim: false
