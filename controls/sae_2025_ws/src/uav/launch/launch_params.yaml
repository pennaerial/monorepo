# launch_params.yaml
mission_name: payload_drive_to_apriltag
uav_debug: false
vision_debug: false
auto_launch: true

# PX4 / airframe settings for UAV missions and sim-backed payload missions.
airframe: standard_vtol
custom_airframe_model: ""

# Vehicle camera pipeline settings. Only used when the mission modes require vision nodes.
enable_vehicle_camera_pipeline: true
save_vision_milliseconds: 0
uav_camera_offsets: [0.0, 0.0, 0.0]

# Mission runtime knobs.
servo_only: false
payload_name: "payload_0"
payload_controller: ""

sim: true
