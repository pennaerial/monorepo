# launch_params.yaml
mission_name: payload_corner_navigate_sim
# Vehicle namespace for mission-facing topics/services.
# Leave blank to use the mission-target default (`uav` for UAV missions, `payload_0` for payload missions).
vehicle_name: ""
debug: true
vision_debug: true
# Automatically start the mission manager once its runtime is ready.
# Set false to leave the mission idle until /<vehicle>/mode_manager/start_mission is called.
auto_launch: true

# PX4 / airframe settings for UAV missions and sim-backed payload missions.
airframe: standard_vtol # Enter a preset below or a valid airframe ID (integer), either custom or from PX4
# quadcopter, tiltrotor_vtol, fixed_wing, standard_vtol, quadtailsitter
# Other useful IDs: 4014 for mono cam down
# IDs available for simulation can be found in PX4-Autopilot/ROMFS/px4fmu_common/init.d-posix/airframes
# These IDs load an airframe file and the corresponding model file in PX4-Autopilot/Tools/simulation/gz/models
# Note: takeoff type (horizontal or vertical) is set in the mission yaml file
custom_airframe_model: "" # Leave blank if using default PX4 model or enter file name of custom model
# Optional explicit PX4 multi-instance index for sim. Fleet orchestration assigns this automatically.
px4_instance: 0

# Force the camera stack (v4l2 + camera node) to launch even when the selected
# mission metadata does not require it.
force_camera: true

# Vehicle camera settings. Applied whenever the camera pipeline launches.
save_vision_milliseconds: 0 # Interval between saving vision images in milliseconds, set to 0 to disable saving.
camera_mount_offsets: [0.0, 0.0, 0.0]
# camera_input_transport: raw
# camera_rotate_degrees: 0.0
camera_calibration_file: ""
camera_preprocess_hook: ""

# Mission runtime knobs.
servo_only: false
payload_controller: ""

sim: true
