# Minimal dual-payload fleet example for peer communication testing.
#
# Launch with:
#   ros2 launch uav fleet.launch.py \
#     fleet_file:=$(pwd)/src/uav/uav/fleets/payload_peer_fleet_test_dual.yaml
#
# Each payload runs PayloadPeerFleetTestMode, which exercises:
# - mission-level peer declarations
# - peer heartbeat gating
# - peer subscriptions to the other payload's local topic
# - shared pub/sub on /shared/peer_test/broadcast

backend:
  kind: sim
  world_name: sae
  mission_stage: base

defaults:
  auto_launch: true
  debug: true
  vision_debug: false
  debug_vision_node: false
  force_camera: false
  save_vision_milliseconds: 0
  servo_only: false
  camera_mount_offsets: [0.0, 0.0, 0.0]
  camera_input_transport: raw
  camera_rotate_degrees: 0.0
  camera_calibration_file: payload_0_camera_info.yaml
  camera_preprocess_hook: ""

vehicles:
  - name: payload_0
    controllable: payload_0
    mission: payload_peer_fleet_test

  - name: payload_1
    controllable: payload_1
    mission: payload_peer_fleet_test
