# Dual approach: AprilTag tracking with HSV colour fallback for string obstacle.
modes:
  start:
    mode: payload.PayloadDualApproachMode
    params:
      tag_id: 0
      tag_size_m: 0.0508
      tag_forward_gain: 0.5
      tag_max_forward_speed: 0.2
      tag_angular_gain: 0.003
      tag_yaw_gain: 0.6
      lower_hsv: [100, 80, 50]
      upper_hsv: [130, 255, 255]
      color_forward_speed: 0.05
      color_angular_gain: 0.005
      color_centering_threshold_px: 15
      color_drive_angular_scale: 0.00
      color_min_detect_pixels: 25
      prime_height_px: 100
      stop_height_px: 300
      post_prime_lost_frames: 10
      lost_timeout_s: 0.0
      compressed_image: true
