/**:
  ros__parameters:
    # Name of the controller plugin to instantiate.
    # This parameter defaults to "GPIOController" for real, and gets overridden to "SimController" in simulation via launch file arguments.
    controller: "GPIOController"

    pins:
      # Preferred explicit left/right mapping.
      # On this hardware: A* pins are RIGHT motor, B* pins are LEFT motor.
      LEFT_PWM: 13
      LEFT_IN1: 20
      LEFT_IN2: 16
      RIGHT_PWM: 18
      RIGHT_IN1: 15
      RIGHT_IN2: 14

      ENCA_CH1: 5
      ENCA_CH2: 6
      ENCB_CH1: 10
      ENCB_CH2: 9
      SERVO: 23

    motor:
      pwm_frequency: 500.0
      max_wheel_rpm: 270.0
      max_norm_speed: 1.0

    encoder:
      output_cpr: 617
      left_sign: 1
      right_sign: 1

    kinematics:
      wheel_radius_m: 0.01611839
      wheel_separation_m: 0.12132

    pid:
      kp: 0.3
      ki: 0.68
      kd: 0.01
      left_kp: 0.2955
      left_ki: 0.6715
      left_kd: 0.0094
      right_kp: 0.3045
      right_ki: 0.6921
      right_kd: 0.0097
      i_clamp: 1.0
      output_limit_norm: 1.0
      stop_deadband_rpm: 1.0
      velocity_alpha: 1.0

    control:
      loop_ms: 50

    drive_distance:
      speed_mps: 0.15
      min_speed_mps: 0.05
      slowdown_dist_m: 0.05
      tolerance_m: 0.01

    rotate_angle:
      ang_speed_rad_s: 0.8
      min_ang_speed_rad_s: 0.25
      slowdown_deg: 10.0
      tolerance_deg: 5.0

    sim:
      world_name: "sae"
