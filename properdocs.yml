site_name: PennAir Monorepo
repo_url: https://github.com/pennaerial/monorepo

theme:
  name: material
  logo: assets/pennair-preview-150x150.png
  favicon: assets/pennair-preview-150x150.png
  icon:
    repo: fontawesome/solid/trash
  features:
    - navigation.tabs


nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Packages: packages/
  - Hardware Integration: hardware-integration.md
  - API Reference:
    - Python: reference/
    - C++:
      - payload: payload/annotated.md
      - custom_sim_bridge: custom_sim_bridge/annotated.md
      - custom_gz_plugins: custom_gz_plugins/annotated.md
  - Docs Setup: docs-setup.md

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
        - docs/gen_pkg_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - controls/sae_2025_ws/src
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdoxy:
      projects:
        payload:
          src-dirs: controls/sae_2025_ws/src/payload/include controls/sae_2025_ws/src/payload/src
          full-doc: true
          doxy-cfg:
            OUTPUT_LANGUAGE: English
            EXTRACT_ALL: YES
        custom_sim_bridge:
          src-dirs: controls/sae_2025_ws/src/custom_sim_bridge/include controls/sae_2025_ws/src/custom_sim_bridge/src
          full-doc: true
          doxy-cfg:
            OUTPUT_LANGUAGE: English
            EXTRACT_ALL: YES
        custom_gz_plugins:
          src-dirs: controls/sae_2025_ws/src/custom_gz_plugins/src
          full-doc: true
          doxy-cfg:
            OUTPUT_LANGUAGE: English
            EXTRACT_ALL: YES
