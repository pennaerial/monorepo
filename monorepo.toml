[target]
ubuntu = "24.04"
architectures = ["amd64", "arm64"]

[groups.base]
repositories = ["ubuntu", "ros2"]
packages = [
    "ca-certificates",
    "curl",
    "ros-jazzy-ros-base",
    "ros-jazzy-cv-bridge",
    "ros-jazzy-image-transport",
    "ros-jazzy-camera-info-manager",
    "ros-jazzy-generate-parameter-library",
    "ros-jazzy-generate-parameter-library-py",
    "ros-jazzy-robot-state-publisher",
    "ros-jazzy-xacro",
    "ros-jazzy-tf2-ros",
    "ros-jazzy-tf2-msgs",
    "python3-numpy",
    "python3-opencv",
    "python3-scipy",
    "python3-yaml",
]

python_packages = [
    "pydantic>=2,<3",
    "cvxpy>=1.6,<1.7",  # MPC controller; compatible with Ubuntu 24.04's NumPy 1.26
]

[groups.dev]
packages = [
    # gz vendored packages
    "ros-jazzy-ros-gz",
    "ros-jazzy-gz-tools-vendor",
    "ros-jazzy-gz-cmake-vendor",
    "ros-jazzy-gz-sim-vendor",
    "ros-jazzy-gz-plugin-vendor",
    "ros-jazzy-gz-transport-vendor",
    "ros-jazzy-gz-common-vendor",
    "ros-jazzy-gz-msgs-vendor",
    "ros-jazzy-gz-math-vendor",

    # Visualization
    "ros-jazzy-rviz2",
    "ros-jazzy-image-view",

    # Build tooling
    "build-essential",
    "cmake",
    "git",
    "pkg-config",
    "python3-colcon-common-extensions",
    "python3-rosdep",
    "python3-venv",
    "libeigen3-dev",
    "libcamera-dev",

    # Tests
    "python3-pytest",
    "ros-jazzy-launch-testing",
    "ros-jazzy-launch-testing-ament-cmake",
    "ros-jazzy-ament-cmake-gtest",

    # Linting
    "ros-jazzy-ament-lint-auto",
    "ros-jazzy-ament-lint-common",
    "ros-jazzy-ament-copyright",
    "ros-jazzy-ament-flake8",
    "ros-jazzy-ament-pep257",
    "ros-jazzy-ament-cmake-clang-format",
    "ros-jazzy-ament-cmake-cppcheck",
    "ros-jazzy-ament-cmake-flake8",
    "ros-jazzy-ament-cmake-lint-cmake",
    "ros-jazzy-ament-cmake-mypy",
    "ros-jazzy-ament-cmake-pep257",
    "ros-jazzy-ament-cmake-pyflakes",
    "ros-jazzy-ament-cmake-uncrustify",
    "ros-jazzy-ament-cmake-xmllint",
    "clang-format",
]
python_packages = [
    "pupil-apriltags",
    "pymavlink",
    "junitparser",
    "ruff==0.16.7",
]

# Pis build the source pushed by `pennair push`, so prod needs build tools too.
[groups.prod]
packages = [
    "build-essential",
    "cmake",
    "python3-colcon-common-extensions",
    "rsync",
]
python_packages = [
    "pymavlink",  # uav ulog streaming
]
# Built from source and installed by hand for now. Checked against `ldconfig -p`,
# so a versioned name like "libfoo.so.2.4" also checks the version.
libraries = [
    "libpigpiod_if2.so",  # payload_controller GPIO
    "libmicroxrcedds_agent.so.2.4",  # MicroXRCEAgent, must match PX4 1.17's client
]

# Source that `pennair push` copies to ~/monorepo on each Pi and builds there.
[deploy]
paths = [
    "monorepo.toml",
    "ros_ws/src/common/px4_msgs",
    "ros_ws/src/common/vehicle_common",
    "ros_ws/src/common/uav",
    "ros_ws/src/iarc/iarc_flight",
    "ros_ws/src/sae/payload_interfaces",
    "ros_ws/src/sae/payload_controller",
]

[environments.dev]
os = ["linux", "macos"]
architectures = ["amd64", "arm64"]
groups = ["base", "dev"]
repository_policy = "live"  # use mode updated versions

[environments.prod]
os = ["linux"]
architectures = ["arm64"]
groups = ["base", "prod"]
repository_policy = "snapshot"  # pin package versions for reproducibility


###################################
#   UBUNTU APT CONFIGURATION
###################################

# Ubuntu-only APT repository; select sources matching the host architecture.
[apt.repositories.ubuntu]
prod_snapshot = "20261013T000000Z"
os = "ubuntu"
signed_by = "/usr/share/keyrings/ubuntu-archive-keyring.gpg"
components = ["main", "universe"]

[[apt.repositories.ubuntu.sources]]
architectures = ["amd64"]
uri = "http://archive.ubuntu.com/ubuntu"
suites = ["noble", "noble-updates"]

[[apt.repositories.ubuntu.sources]]
architectures = ["amd64"]
uri = "http://security.ubuntu.com/ubuntu"
suites = ["noble-security"]

[[apt.repositories.ubuntu.sources]]
architectures = ["arm64"]
uri = "http://ports.ubuntu.com/ubuntu-ports"
suites = ["noble", "noble-updates", "noble-security"]


###################################
#   ROS 2 APT CONFIGURATION
###################################

[apt.repositories.ros2]
prod_snapshot = "2026-10-05"
# Snapshot sources require the separate ROS snapshots signing key.
os = "ubuntu"
components = ["main"]
signed_by = "/usr/share/keyrings/ros2-archive-keyring.gpg"

[[apt.repositories.ros2.sources]]
architectures = ["amd64", "arm64"]
uri = "http://packages.ros.org/ros2/ubuntu"
suites = ["noble"]
